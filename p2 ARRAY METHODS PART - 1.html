       <center>
            <h2>1) toString();</h2>
            <p>The toString return a string with array values Separated by commas.</p>
            <p>It does not change the original array.</p>
        </center>
        <hr>


        <script>
            var fruits = ["Apple", "Banana", "Kiwi", "Berry"];
            console.log("fruits length = ", fruits.length);
            console.log("fruits datatype = ", typeof(fruits));

            console.log("fruits array = ", fruits);

            var convertedFruitstoString = fruits.toString();
            console.log("converted fruits ro string = ", convertedFruitstoString);
            console.log(typeof(convertedFruitstoString));
            
        </script>
