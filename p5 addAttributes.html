<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            width: 300px;
            padding: 20px;
            box-shadow: 0px 0px 10px #ccc;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <center>
        <h1>DOM</h1>
    </center>
    <hr>

    <h1 id="heading">This is the heading</h1>

    <button onclick="addAttributes()">addAttributes</button>
    <button onclick="removecardclass()">remove card class</button>
    <script>
        var heading = document.getElementById('heading');

        function addAttributes(){
            console.log(heading.getAttribute('id'));
            
            //setting attributes
            heading.setAttribute("title", "hello"); //(attribute, value)
            // heading.setAttribute("style", "color:red; background:lightgray"); //(attribute, value)

            heading.setAttribute("class", "card")
        }

        function removecardclass(){
            heading.setAttribute("class", "")
        }
    </script>
</body>
</html>
