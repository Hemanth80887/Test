    <center>
        <h1>Concat()</h1>
        <p>the Concat() is used to merge the one or more string with single string or adding one string another one string (string concatination)</p>
    </center>
    <hr>

    <pre>
        string1.concat(string2, string3)
    </pre>
    <hr>


    <script>
        var str1 = "hello1"
        var str2 = "hello2"
        var str3 = "hello3"


        var concatedString = str1.concat(str2, str3);

        console.log(concatedString);
        
    </script>
