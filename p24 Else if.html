<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <center>
        <h1>Else if</h1>
    </center>
    <hr>


    <script>
        var temperature = 32;

        if(temperature>35){
            console.log("its super hot! wear shorts");
            
        }else if(temperature>20){
            console.log("Nice weather! A T-shirt is fine.");
            
        }else if(temperature>10){
            console.log("Little bit Cold! wear a jacket");
            
        }else{
            console.log("temperature in invalid");
            
        }



        var marks = prompt("ENter your marks");

        if(marks>=80 && marks<=100){
            console.log('first class');
            
        }else if(marks>=50 && marks<80){
            console.log("second class");
            
        }else if(marks>=30 && marks<50){
            console.log("Third class");
            
        }else if(marks<30){
            console.log('fail');
            
        }else{
            console.log("Please enetr valid marks..");
        }
    </script>
</body>
