<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>Nested for loop</h1>
    </center>
    <hr>



    <script>
        for(let i=0; i<10; i++){
            document.write(`<h1 style="color:green">This is from first loop and i = ${i}</h1>`);
            for(let j=0; j<4; j++){
            document.write(`<h2 style="color:red">This is from second loop and j = ${j}</h2>`);

            }
        }
        
    </script>
</body>
</html>
