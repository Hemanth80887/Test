<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number</title>
</head>
<body>
    <center>
        <h1>Number Datatype</h1>
    </center>
    <hr>



    <script>
        //creating number datatype that can be with decimal (float) or without decimal(int)
        var firstNumber = 100;//number datatype declartion
        //checking datatype of any variable using typeOf(variabel_name) keyword
        document.write(typeof(firstNumber));//number
        document.write(`<h1>Datatype of firstnumber = ${typeof(firstNumber)}</h1>`)

        //printing number datatype value
        document.write(`<h1>Datatype of firstnumber = ${firstNumber}</h1>`);


        let points = 1.234;
        document.write(`<h1>Datatype of teh points variable  = ${typeof(points)}</h1>`);


        //re assigning value to number datatypes
        //variable_name = new_value
        firstNumber = 500;
        document.write(`<h1>AFter update the firstNumber datatype  = ${typeof firstNumber}</h1>`);
        document.write(`<h1>AFter update the firstNumber value  = ${firstNumber}</h1>`);
    </script>
</body>
</html>
