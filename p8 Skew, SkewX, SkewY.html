<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            padding: 4%;

        }
        .container div{
            width: 300px;
            height: 300px;
            background-color: lightcoral;
            border: 3px solid #0c0c0c;
            margin: auto;
            margin-bottom: 40px;  
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;   
            transition: 2s;  
         }
         .box1:hover{
            transform: skew(45deg);
         }
         .box2:hover{
            transform: skewX(45deg);
         }
           .box3:hover{
                transform: skewY(-15deg);

                /* multiple things applying  */
                transform: translate() translateX() translateY() rotate() rotateX('angle') rotateY('angle') scale() skew();
         }
         
    </style>
</head>
<body>
    <center>
        <h1>Skew, SkewX, SkewY</h1>
    </center>

    <hr>
    <section class="container">
        <div class="box1">
            <h1>Skew Example both x and y axises</h1>
        </div>
        <div class="box2">
            <h1>SkewX exmaple</h1>
        </div>
        <div class="box3">
            <h1>SkewY Example</h1>
        </div>
    </section>
</body>
</html>
