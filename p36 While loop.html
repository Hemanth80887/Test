<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops</title>
</head>
<body>
    <center>
        <h1>While loop</h1>
    </center>
    <hr>


    <script>
        //declaration
        // while(condition){
        //     //executable code
        //     //increment/decrement
        // }
        var i=0;//declaration
        while(i<=10){
            //code
            console.log('i value  = ', i);
            
            //incre/decre
            i++;
        }

        //countdown example
        var count = 10;
        while(count>=0){
            document.write(`<h1>Count = ${count}</h1>`);
            count--;
        }
        

    </script>
</body>
</html>
