<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPCL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    <style>
        body {
            background-color: #273de2cd;
            color: white;
        }
        #display {
            color: rgb(1, 1, 1);             
            min-height: 200px;        
            padding: 10px;
}
    </style>
</head>
<body>
    <section>
        <center>
            <h1 class="p-4">Hindustan Petroleum 
                <img src="https://companieslogo.com/img/orig/HINDPETRO.NS-6dfea446.png?t=1720244492" width="55px">
            </h1>
            <h1>Welcome to Hindustan Petroleum</h1>
            
            <div class="form-control w-50 p-4 fs-4">
                <div class="mb-3">
                    <label for="amt" class="form-label mt-5">Enter the amount</label>
                    <input type="number" class="form-control" id="amt" placeholder="Enter the Amount">
                    <button onclick="Petrol()" type="button" class="btn btn-success w-25 me-5 mt-3">Petrol</button>
                    <button onclick="Diesel()" type="button" class="btn btn-warning w-25 mt-3">Diesel</button><br>
                    <button type="button" class="btn btn-success w-25 mt-4" onclick="Confirm()">Confirm</button><br>
                    <button type="button" class="btn btn-info w-25 mt-4" onclick="Receipt()">Receipt</button>
                </div>
            </div>

            
            <div id="display" class="mt-4 p-3"></div>
        </center>
    </section>

    <script>
        var amount = document.getElementById('amt');
        var display = document.getElementById('display');
        var liter = 0;
        var receipt = [];

        function Petrol() {
            let petrol = parseInt(amount.value);
            liter = petrol / 110;
            receipt.push({
                Date: new Date().toLocaleDateString(),
                Time: new Date().toLocaleTimeString(),
                type: "Petrol",
                amount: petrol,
                liter: liter.toFixed(2) 
            });
        }

        function Diesel() {
            let diesel = parseInt(amount.value);
            liter = diesel / 90;
            receipt.push({
                Date: new Date().toLocaleDateString(),
                Time: new Date().toLocaleTimeString(),
                type: "Diesel",
                amount: diesel,
                liter: liter.toFixed(2) 
            });
        }

        function Confirm() {
            display.innerHTML = `
                <center><h1>Your Order</h1></center>
            `;
            receipt.forEach((item) => {
                display.innerHTML += `
                    <div class="d-flex justify-content-between p-3 border-bottom" >
                        <h5 >${item.Date}</h5>
                        <h5 >${item.Time}</h5>
                        <h5 >${item.type}</h5>
                        <h5 >${item.liter} Liters</h5>
                        <h5 class="float-end" >&#8377; ${item.amount}</h5>
                    </div>
                `;
            })
            display.innerHTML += `<center><h3 >Thank you for using our Service</h3></center>`;
            amount.value = ""; 
            
        }
        

        function Receipt() {
    const element = document.getElementById('display');
    const opt = {
        margin: 0.5,
        filename: 'Fuel_Receipt.pdf',
        image: { type: 'png', quality: 1 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().from(element).set(opt).save();
}
    </script>
</body>
</html>
