<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <center>
        <h1>pre decrement and post decrement and  post increment and pre increment</h1>
    </center>
    <hr>

    <script>
        var firstnumber = 50;
        ++firstnumber //1 + 50 = 51
        console.log(firstnumber);
        


        var secondNumber = 100;
        secondNumber++; //secondNumber + 1 = 101
        console.log(secondNumber);
        

        var thirdNumber = 200;
        --thirdNumber;

        console.log(thirdNumber);

        var fourthNumber = 500;
        fourthNumber--;
        console.log(fourthNumber);


        var fifthNumber = 99;
        --fifthNumber;//98
        fifthNumber++;//99

        {
            fifthNumber = 100-1;
            fifthNumber++
        }
        fifthNumber++;
    console.log(fifthNumber);
            
        
        
    </script>
</body>
</html>
