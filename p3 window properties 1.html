<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
    <div id="result" class="p-2 d-flex justify-content-between align-items-center text-white">
        
    </div>


    <script>
        var result = document.getElementById('result');
        function checkstatus(){
            if(window.location.protocol != "https"){
                result.classList.remove("bg-success")
                result.classList.add("bg-danger")
                result.innerHTML = `
                    <p class="m-0">&times; This website is not secured</p>

                    <div class="d-flex gap-3">
                        <button class="btn btn-light btn-sm">Close</button>    
                        <button class="btn btn-outline-light btn-sm">Continue</button>    
                    </div>
                `
            }else{
                 result.classList.remove("bg-danger")
                 result.classList.add("bg-success")
                result.innerHTML = `
                    <p class="m-0">This website is not secured</p>

                    <div class="d-flex gap-3">
                        <button class="btn btn-light btn-sm">Close</button>    
                        <button class="btn btn-outline-light btn-sm">Continue</button>    
                    </div>
                `
            }
        }

        setInterval('checkstatus()', 1000)
    </script>
</body>
</html>
