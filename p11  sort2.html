<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            padding: 4%;
            background-color: rgb(224, 247, 255);
        }
        #products{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }
        .card{
            padding: 10px;
            background-color: white;
        }
        .card img{
            width: 100%;
            min-height: 200px;
            background-color: rgb(239, 239, 239);
            margin-bottom: 10px;
        }
        .card h4{
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card p{
            font-size: 0.8rem;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        header{
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <section class="container">
        <header>
            <button onclick="lowToHigh()">Low <i class="fa-solid fa-arrow-right"></i> High</button>
            <button onclick="highToLow()">High <i class="fa-solid fa-arrow-right"></i> Low</button>
            <button onclick="defaultArray()">clear Filter</button>
        </header>
        <div id="products"></div>
    </section>
    



    <script>
     var products = [];

        async function getproducts(){
            await axios.get("https://dummyjson.com/products")
            .then(res=>{
                console.log(res);
                products = res.data.products;
                displayProducts()
                
            })
            .catch(err=>console.log(err))
        }
        getproducts();
  var productsContainer = document.getElementById("products");
  var originalArray = products;

  function displayProducts(){
    productsContainer.innerHTML = "";
    for(var item of products){
        productsContainer.innerHTML += `
            <div class="card">
                <img src = ${item.thumbnail}>
                <h4>${item.title}</h4>
                <h3>&#8377; ${item.price}/-</h3>
                <p>Rating ${parseInt(item.rating)} ${printStars(parseInt(item.rating))}</p>
                <a href="">View Details <i class="fa-solid fa-arrow-right"></i></a>
                </div>
        `
    }
  }
function printStars(rating){
    var result = "";
    for(let i=1; i<=rating; i++){
        result += "<i class='fa-solid fa-star' style='color:gold'></i>"
    }

    for(let j = 1; j<=5-rating; j++){
             result += "<i class='fa-solid fa-star' style='color:gray'></i>"
    }

    return result;
}

  console.log(originalArray);
  

  function lowToHigh(){
        products.sort((a, b)=>a.price-b.price);
        console.log(products);
        displayProducts()
        
  }


   function highToLow(){
        products.sort((a, b)=>b.price-a.price);
        console.log(products);
        displayProducts()
  }
  function defaultArray(){
    products = originalArray;
    console.log(originalArray);
    
    displayProducts()
  }



  
    </script>
</body>
</html>
