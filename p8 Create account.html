            <option value="user">user</option>
            <option value="admin">admin</option>
        </select>

        var username_input = document.getElementById('name')
        var email_input = document.getElementById('email')
        var phone_input = document.getElementById('phone')
        var age_input = document.getElementById('age')
        var role_select = document.getElementById('role')
        var errorstatus = document.querySelector('.error')

         async function uploadData(e){
            e.preventDefault()

           await axios.post('http://localhost:5000/create/new/user', {
            username:username_input.value,
            email:email_input.value,
            age:age.value,
            phonenumber:phone_input.value,
            rule:role_select.value
           })
                .then((res)=>{
                    console.log(res);
                    console.log(res.data);
                  
                    if(res.status==200){
                        errorstatus.innerHTML = `<span>${res.data.message}</span>`
                    }
                    
                })
                .catch((error)=>{
                    console.log(error);
                    errorstatus.innerHTML = `<span style="color:red">${error.message}</span>`
                })
        }

        

        function deleteUser(){
