<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #111118;
        }
       .sun{
        width: 150px;
        height: 150px;
        border-radius: 100px;
        background-color: #111118;
        position: absolute;
        animation: move 6s ease-in infinite alternate;
       }

         .moon{
        width: 150px;
        height: 150px;
        border-radius: 100px;
        background-color: rgb(236, 92, 35);
        animation: glow 6s  cubic-bezier(0.165, 0.84, 0.44, 1) infinite alternate;
       }

       @keyframes move{
            0%{
                transform: translateX(-200px);
            }
            50%{
                transform: translateX(0px);

            }
            70%{
                transform: translateX(0px);
            }
            100%{
                transform: translateX(200px);

            }
       }

        @keyframes glow{
            0%{
               box-shadow: 0px 0px 0px transparent;
            }
            50%{
                box-shadow: 0px 0px 30px rgb(236, 92, 35);
            }
            60%{
                box-shadow: 0px 0px 60px rgb(236, 92, 35);
            }
            70%{
                box-shadow: 0px 0px 80px rgb(236, 92, 35);
            }
            100%{
                box-shadow: 0px 0px 0px transparent;
            }
       }
      
    </style>
</head>
<body>
    <div class="container">
       <div class="moon"></div>
       <div class="sun"></div>
    </div>
</body>
</html>
