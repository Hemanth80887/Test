<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo classess</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: lightslategray;
        }
        .container form{
            background-color: white;
            padding: 30px;
        }
        .container form input{
            width: 100%;
            border: none;
            outline: none;
            padding: 10px;
            margin-top: 5px;
        }
        fieldset{
            padding: 10px;
        }
        button{
            border: none;
            margin-top: 15px;
            padding: 10px;
            cursor: pointer;
        }

        input:enabled{
            border: 1px solid green !important;
            background-color: rgba(250, 250, 210, 0.328);
        }
        input:disabled{
            border: 1px solid darkgray !important;
            background-color: rgb(193, 193, 193);
            cursor: no-drop;
        }
        input:disabled::placeholder{
            color: red;
        }

        button:enabled{
            /* design here  */
        }
        button:disabled{
            cursor: no-drop;
            background-color: lightgray;
            color: red;
            border: 1px solid red;
        }
        p{
            padding: 10px;
        }

        p:empty{
            border: 1px dashed gray;
            background-color: rgb(242, 242, 242);
        }
    </style>
</head>
<body>
    <center>
        <h1>:disabled, :enabled, :empty</h1>
    </center>
    <hr>

    <section class="container">
        <form autocomplete="on">
            <fieldset>
                <legend>Firstname</legend>
                <label for="f_name">Firstname</label>
                <input type="text" name="F_name" id="f_name" placeholder="Type here.." required>
            </fieldset>

             <fieldset>
                <legend>Email address</legend>
                <label for="email">Email address</label>
                <input type="email" name="email" id="email" placeholder="Type here.." required disabled>
            </fieldset>
            <button type="submit">Create account</button>
            <button type="button" disabled>Next</button>
            <button type="reset">Cancel</button><br><br>
            <hr><br><br>
            <p>This is the paragraph</p>
            <p></p>
            <p>This is the paragraph</p>
        </form>
    </section>
    
</body>
</html>
