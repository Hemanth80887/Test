<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>Arithmetic Operators</h1>
    </center>
    <hr>


    <p><p>note: </p> Operation between 2 operands (2 values) that is called operator</p>
    <script>
        // var firstnumber = 100;
        // var secondNumber = 200;

        var firstnumber = 100, secondNumber = 200;

        document.write(`<h1>Addition airthmetic operator using + symbol</h1>`)
        document.write(`<h1 style="color:green">Addition of firstnumber ${firstnumber} and secondNumber ${secondNumber} = ${firstnumber + secondNumber} </h1>`);


        
        document.write(`<h1>Substraction arthmetic operator using - symbol</h1>`)
        document.write(`<h1 style="color:green">substraction of firstnumber ${firstnumber} and secondNumber ${secondNumber} = ${firstnumber - secondNumber} </h1>`);


        
        document.write(`<h1>multiplicatiion airthmetic operator using + symbol</h1>`)
        document.write(`<h1 style="color:green">multiplicatiion of firstnumber ${firstnumber} and secondNumber ${secondNumber} = ${firstnumber * secondNumber} </h1>`)


           document.write(`<h1>division airthmetic operator using + symbol</h1>`)
        document.write(`<h1 style="color:green">division of firstnumber ${firstnumber} and secondNumber ${secondNumber} = ${firstnumber / secondNumber} </h1>`)

         document.write(`<h1>modulus airthmetic operator using + symbol</h1>`)
        document.write(`<h1 style="color:green">modulus of firstnumber ${firstnumber} and secondNumber ${secondNumber} = ${firstnumber % secondNumber} </h1>`)

    </script>

</body>
</html>
