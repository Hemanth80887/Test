<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            padding: 4%;

        }
        .container div{
            width: 300px;
            height: 300px;
            background-color: lightcoral;
            border: 3px solid #0c0c0c;
            margin: auto;
            margin-bottom: 40px;  
            padding: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;   
            transition: 2s;  
         }
         .box1:hover{
            transform: translate(100px, 200px);
            /* transform: translate(-100px, -200px); */
         }
         .box2:hover{
            transform: translateX(-200px);
            /* transform: translateX(200px); */
         }
           .box3:hover{
            /* transform: translateY(-200px); */
            transform: translateY(200px);
         }
         
    </style>
</head>
<body>
    <center>
        <h1>Translate, translateX, translateY</h1>
    </center>

    <hr>
    <section class="container">
        <div class="box1">
            <h1>Translate Example both x and y axises</h1>
        </div>
        <div class="box2">
            <h1>TranslateX exmaple</h1>
        </div>
        <div class="box3">
            <h1>TranslateY Example</h1>
        </div>
    </section>
</body>
</html>
