<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <style>
    *{
     padding: 0;
        margin: 0;
        box-sizing: border-box;
         font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .hero{
            height: 100vh;
            position: relative;
            background-color: rgba(0, 0, 0, 0.509);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
     }
    .hero video{
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
     }
     .hero div{
            text-align: center;
     }
     .hero h1{
            font-size: 80px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 80px;
     }
     .hero p{
            font-size: 30px;
            margin-top: 25px;
            letter-spacing: 1px;
    }
     .hero .p{
            font-size: 20px;
    }
    .hero .p a{
        text-decoration: none;
        color: white;
     }
    .hero button{
            width:200px;
            background-color: transparent;
            border: 2px solid white;
            padding:2% 0%;
            color: white;
            font-size: 25px;
            font-weight: 500;
            margin-top: 25px;
            text-transform: uppercase;
     }
    .hero button:hover{
            background-color: white;
            color: black;
    }
    </style>

</head>
<body>
    <section class="hero">
        <video src="./854106-hd_1920_1080_25fps.mp4" autoplay muted loop></video>
        <div data-aos="zoom-in" data-aos-delay="500">
            <h1>Transforming live </h1>
            <h1>restoring hope</h1>
            <p>Duis aute irure dolor in reprehenderit in voluptate velit esse</p>
            <p class="p">Image from <a href="#">Freepik</a></p>
            <button>read more</button>
        </div>
    </section>
</body>
</html>
