        <center>
            <h2>13) isArray();</h2>
            <p>The isArray() method returns true if an object is an array, otherwise false</p>
        </center>
        <hr>

        <p><b>SYNATX :</b></p>
        <pre>
            Array.isArray(array object);
        </pre>
        <hr>

        <script>
            var stringvalue = "hello";
            var numberValue = 100;
            var names = ["kiran", "arun", "varun", "tharun", "john", "don"];

            console.log("stringValue in isArray = ", Array.isArray(stringvalue));//false
            console.log("numberValue in isArray = ", Array.isArray(numberValue));//false
            console.log("names variable in isArray = ", Array.isArray(names));//true
            
        </script>
