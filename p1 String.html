<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <center>
                <h1>String</h1>
                <p>string is a sequence of charecters like letters, symbols, numbers ect..</p>
        </center>
        <hr>


        <script>
            //literal ways create strings
            var str1 = "Arun kumar"//"" '' ``
            console.log("str1 = ", str1);
            console.log("str1  length= ", str1.length);
            

            //creating by using string constructor
            // var str2 = "Kiran kumar"
            var str2 = new String();
            console.log(str2);
            console.log(str2.length);

            //assigning some values
            str2[0] = "k";
            console.log(str2);

            str2[1] = "i"
            str2[2] = "r"
            str2[3] = "a"
            str2[4] = "n"
            str2[5] = " "
            str2[6] = "k"
            str2[7] = "u"
            str2[8] = "m"
            str2[9] = "a"
            str2[10] = "r"

            console.log("str2 = ", str2);


            //directly assigning values
            str2 = "hello";
            console.log(str2);




            //string creating by using constructor with parameter
            var str3 = new String("this is the js string using constructor with parameter")
            console.log("str3 = ", str3);
            console.log("str3 length= ", str3.length);
            
            
            
            
        </script>
</body>
</html>
