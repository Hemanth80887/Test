<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>Math static (constant) values or properties</h1>
    </center>
    <hr>


    <script>
        document.write(`<h1>Math.E = ${Math.E}</h1>`); //Euler's number 2.71828
        document.write(`<h1>Math.PI = ${Math.PI}</h1>`); // 3.141592653589793
        document.write(`<h1>Math.LN2 = ${Math.LN2}</h1>`); // 0.6931471805599453
        document.write(`<h1>Math.LN10 = ${Math.LN10}</h1>`); // 2.302585092994046
        document.write(`<h1>Math.LOG2E = ${Math.LOG2E}</h1>`); // 1.4426950408889634
        document.write(`<h1>Math.LOG10E = ${Math.LOG10E}</h1>`); // 0.4342944819032518
        document.write(`<h1>Math.SQRT1_2 = ${Math.SQRT1_2}</h1>`); //0.7071067811865476
        document.write(`<h1>Math.SQRT2 = ${Math.SQRT2}</h1>`); //1.4142135623730951

    </script>
</body>
</html>
