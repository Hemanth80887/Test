<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>With parameter and with return value</h1>
    </center>
    <hr>

    <script>
        function calculationHandler(a, b){//declaration
            let total = a+b;

            return total; //returning value
        }
        document.write(`<h1>Function with parameter and return values = ${calculationHandler(10, 20)}</h1>`)
        document.write(`<h1>Function with parameter and return values = ${calculationHandler(1, 22)}</h1>`)
    </script>
</body>
</html>
