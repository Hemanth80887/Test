<body>
      <center>
            <h2>11) slice();</h2>
            <p>The slice() method slices out a piece from an array. It creates a new array.</p>
        </center>

        <hr>

        <script>
             var names = ["kiran", "arun", "varun", "tharun", "john", "don"]
             console.log(names);
             var cuttedpiece = names.slice(1, 4)
             console.log(cuttedpiece);
             console.log(names);
             
             
        </script>
</body>
