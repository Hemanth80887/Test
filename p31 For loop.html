<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <h1>For loop, while, do while, forEach() method, for..of, for..in, map() </h1>
    </center>


    <script>

        //map
        var users = ["arun", "varun", "kiran"];
        
        users.map((item)=>{
            console.log(item);
            
        })

        //for loop

        const fruits = ["Apple", "Banana", "Orange", "Papaya"];

        for (let i = 0; i < fruits.length; i++) {
         console.log(fruits[i]);
        }

        //while

        const fruits1 = ["Apple", "Banana", "Orange", "Papaya"];
         let i=0;
         while(i<fruits1.length){
            console.log(fruits1[i]);
            i++;
         }

         //do while

         const fruits2 =["Apple", "Banana", "Orange", "Papaya"];
         let j=0;

         do{
            console.log(fruits2[j]);
            j++;
         }while (i<fruits2.length);
           
         //for each()

         const fruits3 =["Apple", "Banana", "Orange", "Papaya"];

         fruits3.forEach(function (fruits) {
            console.log(fruits)
      
         })
         
         //for of()

         const fruits4 =["Apple", "Banana", "Orange", "Papaya"];   // value

         for(const fru of fruits4){
            console.log(fru);
         }

         //for in

         const fruits5 =["Apple", "Banana", "Orange", "Papaya"];  // index value

         for(const value in fruits5){
            console.log(fruits5[value]);
         }




    </script>
</body>
</html>
