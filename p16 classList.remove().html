<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <script>
        var titles = [
            "hello",
            "hi",
            "heading",
            "paragraph",
            "javascript",
            "react js"
        ]
        var index = 0;
        function changeTitle(){
           if(index<titles.length){
             document.title = titles[index];
            index++;
           }else{
            index=0;
           }
        }

        setInterval("changeTitle()", 1000)
    </script>
</body>
</html>
