<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
     
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
     <style>
        .btns button{
            width: 100px;
            height: 100px;
            border-radius: 100px;
            font-size: 1.7rem;
            font-weight: 600;
        }
        .btns button:disabled{
            background-color: rgb(244, 244, 244);
            border: 2px solid rgb(204, 204, 204);
            cursor: not-allowed;
            color: rgb(187, 187, 187);
        }
        .btns .start{
            background-color: rgb(78, 185, 185);
            color: white;
            border: 2px solid transparent;


        }

        .btns .split{
            background-color: orange;
            color: white;
            border: 2px solid transparent;
            

        }

         .btns .reset{
            background-color: rgb(240, 84, 49);
            color: white;
            border: 2px solid transparent;
            

        }
        .result{
            display: flex;
            align-items: end;
            justify-content: center;

        }
        .result span{
            min-width: 50px;
        }
        table{
            width: 80% !important;
            margin-top: 40px;
        }
        @media (min-width:360px) and (max-width:640px) {
            button{
                width:60px !important;
                font-size: 1.2rem !important;
                height:60px !important;
            }
            dialog{
                width: 100% !important;
                padding: 10px !important;
            }
            dialog select{
                font-size: 15px !important;
                width:80% !important;
            }
            dialog button{
                width:80px !important;
                height:40px !important;
                font-size: 18px !important;
            }
        }
     </style>
</head>
<body>
    <div class="container-fluid">
     <div class="p-4 text-center" style="background-color: rgb(253, 221, 226);">
           <h1 class=" fw-bold result" ><span id="hrs">00</span>:<span id="min">00</span>:<span id="seconds">00</span>.<span class="" id="millisec" >0</span><small id="helper">00</small></h1>
     </div>
     <h1 class="text-warning display-6  mt-2 fw-bold">SPLIT TIME</h1>

     <form class="btns d-flex gap-3 mt-4">
        <button class="start" type="button"onclick="startTimehandler()">Start</button>
        <button class="split"  type="button" disabled onclick="splitValueHandler()">Split</button>
        <button class="reset"  type="button" disabled onclick="resetHandler()" >Reset</button>
     </form>

     <br>

     <p class="d-flex justify-content-end">
        <span>
            <input type="checkbox" onclick="reverseHandler()">
            Reverse
        </span>
     </p>
     <table id="table"  class="table striped" width="80%" align="center">
        <thead>
            <tr class="bg-primary text-white">
                <th>SI.No</th>
            <th>Interval</th>
            <th>Total</th>
            <th>Time Recorded</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
     </table>
     <div>
        <dialog class="border-0 w-75 p-0">
            <div class=" px-3 py-2 d-flex justify-content-between align-items-center" style="background-color: rgb(236, 14, 6);"><h4 class=" text-white fw-bold">Are you Sure?</h4> <h4 class="fs-1 p-0" style="color:rgba(253, 253, 253, 0.625);background-color: transparent;cursor: pointer;" id="close"><i class="fa-solid fa-xmark"></i></h4>
            </div>
            <div class="p-3" style="line-height: 1.8;">
                <p>All timings will be lost when you reset.</p>
                <label for="" class="fw-bold">Show this message</label><br>
                <select class="" name="" id="">
                    <option value="">Always</option>
                    <option value="">If the StopWatch has reached 5 minutes</option>
                    <option value="">If the StopWatch has reached 15 minutes</option>
                    <option value="">If the StopWatch has reached 60 minutes</option>
                </select>
                <p>You can always change this in <b>Settings and sounds</b>.</p>
            </div>
            <div class="d-flex justify-content-end gap-2 p-3 bg-light">
                <button class="btn btn-outline-info btn-sm" id="dcancel">Cancel</button><button class="btn bg-danger text-white btn-sm" id="dreset">Reset</button>
            </div>

           
     </dialog>
     </div>
    </div>
    

    <script>

        
        
        var hrsTag = document.getElementById('hrs');
        var minTag = document.getElementById('min');
        var secondsTag = document.getElementById('seconds');
        var milliSecondsTag = document.getElementById('millisec');
        var helperTag = document.getElementById('helper');

        var startBtn = document.querySelector('.start')
        var splitBtn = document.querySelector('.split')
        var resetBtn = document.querySelector('.reset')
        var tbody = document.getElementById('tbody');
        var table = document.getElementById("table");
        var hours = 0;
        var minutes = 0;
        var seconds = 0;
        var milliseconds = 0;
        var helpertime = 0;
        var isStarted = false;
        var timeOperation;
        var isPlaying = false;
        var isReversed = false;
        var splittedValues = [];

        if(splittedValues.length==0){
            table.style.visibility = "hidden"
        }else{
            table.style.visibility = "visible"
        }
        function startTimehandler(){
            console.log(isPlaying);
            if(isPlaying){
                resetBtn.disabled = false;
            }else{
                resetBtn.disabled = true;

            }
            
            isStarted = !isStarted;
            if(isStarted){
                isPlaying = true;
                startBtn.innerText = "Pause"
                startBtn.style.backgroundColor = "rgb(240, 84, 49)";
                  timeOperation = setInterval(() => {
                if(helpertime<90){
                    helpertime = helpertime+10;
                helperTag.innerText = helpertime;
                }else{
                   if(milliseconds<10){
                     helpertime = 0;
                    milliseconds++;
                    milliSecondsTag.innerText = milliseconds;
                   }else{
                    if(seconds<60){
                        milliseconds = 0;
                    seconds++;
                    secondsTag.innerText = seconds<10?(`0${seconds}`):(seconds);
                    }else{
                       if(minutes<60){
                         seconds = 0;
                        minutes++;
                       minTag.innerText = minutes<10?(`0${minutes}`):(minutes);
                       }else{
                        minutes=0;
                        hours++;
                     hrsTag.innerText = hours<10?(`0${hours}`):(hours);
                       }

                    }
                   }
                }
            }, 10);



            splitBtn.disabled = false;
            }else{
                isPlaying = false;
                clearInterval(timeOperation);
                  startBtn.innerText = "Start"
                startBtn.style.backgroundColor = "rgb(78, 185, 185)";
            }
           
        }

        function resetHandler(){
            document.querySelector("dialog").showModal();
            document.querySelector("#close").addEventListener("click",()=>{document.querySelector("dialog").close()})
            document.querySelector("#dreset").addEventListener("click",()=>{document.querySelector("dialog").close();
                clearInterval(timeOperation);
            hours = 0, minutes =0, seconds =0, milliseconds = 0, helpertime = 0;
            hrsTag.innerText = "00",minTag.innerText = "00",secondsTag.innerText = "00",milliSecondsTag.innerText = "0", helperTag.innerText = "00"
            })
            document.querySelector("#dcancel").addEventListener("click",()=>{document.querySelector("dialog").close();
                return;
            })
            
        }


        function splitValueHandler(){
            table.style.visibility = "visible"
            var currentTime = `${hours<10?('0'+hours):(hours)}:${minutes<10?('0'+minutes):(minutes)}:${seconds<10?('0'+seconds):(seconds)}.${milliseconds}`
            splittedValues.push(currentTime)
            console.log(splittedValues);
            createTable()

            
        }


        function createTable(){
            var count = isReversed?splittedValues.length:0;
            var date = new Date();
            tbody.innerHTML = ""
            for(item of splittedValues){
                isReversed?count--:count++;
                tbody.innerHTML += `
                    <tr>
                        <td>${isReversed?count+1:count}</td>    
                        <td class="text-warning">${item}</td>    
                        <td>${item}</td>
                        <td class="text-secondary">${date.toLocaleString()}</td>
                    </tr>
                `
            }
        }

        function reverseHandler(){
            isReversed = !isReversed;
            splittedValues.reverse();
            createTable()
        }
    </script>
</body>
</html>
