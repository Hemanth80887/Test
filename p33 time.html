    <script>
        function timeConversion(s) {
            // Write your code here
            var splittedValue = s.split(":");
            console.log(splittedValue);//['07', '05', '45PM']
            var hrs = parseInt(splittedValue[0]);
            var mins = splittedValue[1];
            console.log(hrs);

           var timeformatesplit = splittedValue[2].split("");
           console.log(timeformatesplit);
            var secons = timeformatesplit[0] + timeformatesplit[1];

           var zone = timeformatesplit[2]+timeformatesplit[3]
        //    console.log(timeformatesplit[2], timeformatesplit[3]);
           console.log(zone);

           if(zone=="PM"){
               if(hrs==12){
                hrs=12;
               }else{
                hrs = hrs+12;
               }
           }else{
            if(hrs==12){
                hrs="00"
            }else{
                 hrs = hrs<9?("0"+hrs):(hrs);
            }
           }

           console.log(`${hrs}:${mins}:${secons}`);
  
            
        }
