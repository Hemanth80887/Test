<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS FLEX</title>
    <style>
        .container{
            background-color: #0c0c0c;
            padding: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            height: 100vh;

           /* align-content: start; */
           /* align-content: end; */
           /* align-content: center; */
           /* align-content: space-around; */
           /* align-content: space-evenly; */
           align-content: space-between;
        }
        .item{
            width: 200px;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: darkgoldenrod;
        }
    </style>
</head>
<body>
    <section class="container">
       <div class="item">
        <h1>1</h1>
       </div>
       <div class="item">
        <h1>2</h1>
       </div>
       <div class="item">
        <h1>3</h1>
       </div>
       <div class="item">
        <h1>4</h1>
       </div>
       <div class="item">
        <h1>5</h1>
       </div>
       <div class="item">
        <h1>6</h1>
       </div>
       <div class="item">
        <h1>7</h1>
       </div>
       <div class="item">
        <h1>8</h1>
       </div>
       <div class="item">
        <h1>9</h1>
       </div>
    </section>
    
</body>
</html>
