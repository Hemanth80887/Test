    <center>
        <h1>charAt(index)</h1>
        <p>the charAt method returns value of the specified index position  if the value found or if the value is not found return ""(empty value)</p>
    </center>
    <hr>
    <pre>
        string.charAt(index_position)
    </pre>
    


    <script>
        var str2 = "javascript";
        console.log(str2.charAt(5));//c
        console.log(str2.charAt(15));//""

        var username = "Arun";
        console.log(username.charAt(0));
        
        
    </script>
