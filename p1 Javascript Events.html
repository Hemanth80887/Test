<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events</title>
</head>
<body>
    <center>
        <h1>Javascript Events</h1>
    </center>
    <hr>
    <h2>CLick events that is onclick and ondbclick</h2>
    
    <hr>
    <button onclick="sayHello()">Click</button>
    <button ondblclick="sayBye()">Double click to say bye</button>
    <script>
        function sayHello(){
            alert("Hello this is executed from the function after single click..")
        }

        function sayBye(){
            alert("Hello, this is the bye message from the sayBye function after double click..")
        }
    </script>
</body>
</html>
