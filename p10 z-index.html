<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            padding: 4%;
            display: flex;
            gap: 60px;
            height: 100vh;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .container div{
            width: 300px;
            height: 300px;
            display: flex;
            color: white;
            align-items: center;
            justify-content: center;
            position: absolute;
        }
        .container div h1{
            font-weight: 500;
        }
        .box1{
            background-color: darkgoldenrod;
            top: 20px;
            left: 400px;
            z-index: 2;
        }
        .box2{
            background-color: darkslateblue;
             top: 40px;
            left:420px;
            z-index: 3;
        }
        .box3{
            background-color: darkolivegreen;
              top: 60px;
            left:440px;
            z-index: 4;
        }

        .container div:hover{
            z-index: 5;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="box1">
        <h1>Box1</h1>
       </div>
       <div class="box2">
        <h1>Box2</h1>
       </div>
       <div class="box3">
        <h1>Box3</h1>
       </div>
    </div>

   
</body>
</html>
