<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 10px rgba(255, 126, 95, 0.3);
        }

        .section {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .label {
            width: 100px;
            text-align: right;
            font-weight: bold;
            font-size: 1.2rem;
            margin-right: 20px;
            color: #e6e6e6;
        }

        .bits {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
        }

        button {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(145deg, #2d2d44, #252536);
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: bold;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3),
                        -3px -3px 8px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            opacity: 0;
            transition: opacity 0.3s;
        }

        button:hover::before {
            opacity: 1;
        }

        @keyframes blink {
            0% {
                background: linear-gradient(145deg, #ff7e5f, #feb47b);
                box-shadow: 0 0 15px rgba(255, 126, 95, 0.7);
                transform: scale(1.05);
            }
            50% {
                background: linear-gradient(145deg, #ff9966, #ff5e62);
                box-shadow: 0 0 20px rgba(255, 94, 98, 0.8);
                transform: scale(1.1);
            }
            100% {
                background: linear-gradient(145deg, #ff7e5f, #feb47b);
                box-shadow: 0 0 15px rgba(255, 126, 95, 0.7);
                transform: scale(1.05);
            }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .time-display {
            text-align: center;
            margin-top: 20px;
            font-size: 1.5rem;
            color: #feb47b;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .section {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .label {
                width: 100%;
                text-align: left;
                margin-bottom: 10px;
            }
            
            button {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }
            
            h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Binary Clock</h2>
        
        <div class="time-display" id="currentTime">--:--:--</div>

        <div class="section">
            <div class="label">Hours</div>
            <div class="bits hours">
                <button>8</button>
                <button>4</button>
                <button>2</button>
                <button>1</button>
            </div>
        </div>

        <div class="section">
            <div class="label">Minutes</div>
            <div class="bits minutes">
                <button>32</button>
                <button>16</button>
                <button>8</button>
                <button>4</button>
                <button>2</button>
                <button>1</button>
            </div>
        </div>

        <div class="section">
            <div class="label">Seconds</div>
            <div class="bits seconds">
                <button>32</button>
                <button>16</button>
                <button>8</button>
                <button>4</button>
                <button>2</button>
                <button>1</button>
            </div>
        </div>
    </div>

    <div class="footer">
        Binary Clock | Each light represents a binary digit
    </div>

    <script>
        var allHours = {
            h1: [0, 0, 0, 1],
            h2: [0, 0, 1, 0],
            h3: [0, 0, 1, 1],
            h4: [0, 1, 0, 0],
            h5: [0, 1, 0, 1],
            h6: [0, 1, 1, 0],
            h7: [0, 1, 1, 1],
            h8: [1, 0, 0, 0],
            h9: [1, 0, 0, 1],
            h10: [1, 0, 1, 0],
            h11: [1, 0, 1, 1],
            h0: [1, 1, 0, 0]
        }

        function hourhandler() {
            var presentTime = new Date();
            console.log(presentTime.getHours() % 12);
            var hourskey = "h" + presentTime.getHours() % 12;
            console.log(hourskey);

            console.log(allHours[hourskey]);
            var mainArray = allHours[hourskey]
            for (let index = 0; index < mainArray.length; index++) {
                if (mainArray[index] != 0) {
                    var listItem = document.querySelector(`.hours button:nth-child(${index+1})`)
                    // console.log(listItem.innerText);
                    // listItem.classList.add("active")
                    listItem.style.animation = "blink 0.5s linear infinite"
                } 
            }
        }


        var allMinutes = {
            m0: [0, 0, 0, 0, 0, 0],
            m1: [0, 0, 0, 0, 0, 1],
            m2: [0, 0, 0, 0, 1, 0],
            m3: [0, 0, 0, 0, 1, 1],
            m4: [0, 0, 0, 1, 0, 0],
            m5: [0, 0, 0, 1, 0, 1],
            m6: [0, 0, 0, 1, 1, 0],
            m7: [0, 0, 0, 1, 1, 1],
            m8: [0, 0, 1, 0, 0, 0],
            m9: [0, 0, 1, 0, 0, 1],
            m10: [0, 0, 1, 0, 1, 0],
            m11: [0, 0, 1, 0, 1, 1],
            m12: [0, 0, 1, 1, 0, 0],
            m13: [0, 0, 1, 1, 0, 1],
            m14: [0, 0, 1, 1, 1, 0],
            m15: [0, 0, 1, 1, 1, 1],
            m16: [0, 1, 0, 0, 0, 0],
            m17: [0, 1, 0, 0, 0, 1],
            m18: [0, 1, 0, 0, 1, 0],
            m19: [0, 1, 0, 0, 1, 1],
            m20: [0, 1, 0, 1, 0, 0],
            m21: [0, 1, 0, 1, 0, 1],
            m22: [0, 1, 0, 1, 1, 0],
            m23: [0, 1, 0, 1, 1, 1],
            m24: [0, 1, 1, 0, 0, 0],
            m25: [0, 1, 1, 0, 0, 1],
            m26: [0, 1, 1, 0, 1, 0],
            m27: [0, 1, 1, 0, 1, 1],
            m28: [0, 1, 1, 1, 0, 0],
            m29: [0, 1, 1, 1, 0, 1],
            m30: [0, 1, 1, 1, 1, 0],
            m31: [0, 1, 1, 1, 1, 1],
            m32: [1, 0, 0, 0, 0, 0],
            m33: [1, 0, 0, 0, 0, 1],
            m34: [1, 0, 0, 0, 1, 0],
            m35: [1, 0, 0, 0, 1, 1],
            m36: [1, 0, 0, 1, 0, 0],
            m37: [1, 0, 0, 1, 0, 1],
            m38: [1, 0, 0, 1, 1, 0],
            m39: [1, 0, 0, 1, 1, 1],
            m40: [1, 0, 1, 0, 0, 0],
            m41: [1, 0, 1, 0, 0, 1],
            m42: [1, 0, 1, 0, 1, 0],
            m43: [1, 0, 1, 0, 1, 1],
            m44: [1, 0, 1, 1, 0, 0],
            m45: [1, 0, 1, 1, 0, 1],
            m46: [1, 0, 1, 1, 1, 0],
            m47: [1, 0, 1, 1, 1, 1],
            m48: [1, 1, 0, 0, 0, 0],
            m49: [1, 1, 0, 0, 0, 1],
            m50: [1, 1, 0, 0, 1, 0],
            m51: [1, 1, 0, 0, 1, 1],
            m52: [1, 1, 0, 1, 0, 0],
            m53: [1, 1, 0, 1, 0, 1],
            m54: [1, 1, 0, 1, 1, 0],
            m55: [1, 1, 0, 1, 1, 1],
            m56: [1, 1, 1, 0, 0, 0],
            m57: [1, 1, 1, 0, 0, 1],
            m58: [1, 1, 1, 0, 1, 0],
            m59: [1, 1, 1, 0, 1, 1]
        };

        function minhandler() {
            var presentTime = new Date(); // use current time
            var minKey = "m" + (presentTime.getMinutes() % 60);
            console.log("Minutes key:", minKey);

            var mainArray = allMinutes[minKey];
            console.log(mainArray);

            for (let index = 0; index < mainArray.length; index++) {
                var listItem = document.querySelector(`.minutes button:nth-child(${index + 1})`);
                if (mainArray[index] != 0) {
                    listItem.style.animation = "blink 0.5s linear infinite";
                }else{
                    listItem.style="none";
                } 
            }
        }

        function sechandler() {
            var presentTime = new Date(); // use current time
            var minKey = "m" + (presentTime.getSeconds() % 60);
            console.log("Minutes key:", minKey);

            var mainArray = allMinutes[minKey];
            console.log(mainArray);

            for (let index = 0; index < mainArray.length; index++) {
                var listItem = document.querySelector(`.seconds button:nth-child(${index + 1})`);
                if (mainArray[index] != 0) {
                    listItem.style.animation = "blink 0.5s linear infinite";
                }else{
                    listItem.style="none";
                } 
            }
        }
        
        function updateCurrentTime() {
            var presentTime = new Date();
            var hours = presentTime.getHours().toString().padStart(2, '0');
            var minutes = presentTime.getMinutes().toString().padStart(2, '0');
            var seconds = presentTime.getSeconds().toString().padStart(2, '0');
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(() => {
            hourhandler();
            minhandler();
            sechandler();
            updateCurrentTime();
        }, 1000);
    </script>
</body>

</html>
