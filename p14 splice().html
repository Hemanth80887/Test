     <center>
            <h2>10) splice();</h2>
            <p>The splice() method adds or removes array elements.</p>
            <p>The splice() method overwrites the original array.</p>
        </center>

        <hr>

        <p><b>SYNTAX : </b></p>

        <pre>
            array.splice(index, howmany, item1, item2,..., itemX);
        </pre>

        <hr>

        <script>
            var names = ["kiran", "arun", "varun", "tharun", "john", "don"]
            console.log('before remove = ', names);
            console.log('before remove = ', names.length);
            
            //removing using splice
            names.splice(1, 3);
            console.log('after remove = ', names);
            console.log('after remove = ', names.length);

            // adding values 

            names.splice(5, 1, "hello1")
             console.log('after add = ', names);
            console.log('after add = ', names.length);



        </script>
</body>
