<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container{
            padding: 4%;
            display: flex;
            gap: 10px;
            height: 100vh;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .container img{
            width: 200px;
        }
        .img1{
            aspect-ratio: auto;
        }
        .img2{
            aspect-ratio: 1/1;
        }
        .img3{
            aspect-ratio: 1/0.5;
        }
        .img4{
            aspect-ratio: 0.5/1.1;
        }
         .img5{
            aspect-ratio: 16/9;
        }
    </style>
</head>
<body>
    <div class="container">
      <img src="https://portraitart.app/static/gallery/dog2_cartoon3d_1024.webp" alt="" class="img1">
      <img src="https://portraitart.app/static/gallery/dog2_cartoon3d_1024.webp" alt="" class="img2">
      <img src="https://portraitart.app/static/gallery/dog2_cartoon3d_1024.webp" alt="" class="img3">
      <img src="https://portraitart.app/static/gallery/dog2_cartoon3d_1024.webp" alt="" class="img4">
      <img src="https://portraitart.app/static/gallery/dog2_cartoon3d_1024.webp" alt="" class="img5">
    </div>

   
</body>
</html>
